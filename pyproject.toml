[project]
name = "oficina-inventory-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "alembic>=1.14,<2",
    "boto3>=1.35,<2",
    "python-jose>=3.3,<4",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-cov>=5,<7", "moto[sqs]>=5,<6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
